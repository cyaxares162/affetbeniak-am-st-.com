<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seda, beni affeder misin?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap">
<style>
:root{--bg1:#fde7ee;--bg2:#f6bfd3;--ink:#4a0f2b;--yes:#c2185b;--yesink:#fff;--no:#fff;--noink:#6b2a47;--line:#d98aa8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2b0f1f;--bg2:#47122f;--ink:#ffdce8;--yes:#ff4f8b;--yesink:#2b0f1f;--no:#3a1830;--noink:#f1c3d6;--line:#7a3a58}}
:root[data-theme="dark"]{--bg1:#2b0f1f;--bg2:#47122f;--ink:#ffdce8;--yes:#ff4f8b;--yesink:#2b0f1f;--no:#3a1830;--noink:#f1c3d6;--line:#7a3a58}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
h1{font-family:"Fraunces",Georgia,"Times New Roman",serif;font-weight:800;font-size:clamp(34px,8vw,64px);line-height:1.1;margin:0 0 12px;max-width:14ch}
.emoji{font-size:64px;margin-bottom:8px}
#hint{min-height:1.6em;margin:0 0 28px;font-size:18px;opacity:.85}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:16px}
button{font:inherit;font-weight:700;border:0;border-radius:999px;cursor:pointer;white-space:nowrap;overflow:hidden}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#yes{background:var(--yes);color:var(--yesink);font-size:20px;padding:12px 28px;transition:font-size .35s cubic-bezier(.3,1.5,.5,1),padding .35s cubic-bezier(.3,1.5,.5,1)}
#no{background:var(--no);color:var(--noink);border:2px solid var(--line);font-size:18px;padding:12px 28px;max-width:200px}
#no.bye{pointer-events:none;animation:bye 1.1s ease-in forwards}
@keyframes bye{
 15%{transform:rotate(-12deg) scale(1.08)}
 30%{transform:rotate(10deg) scale(1.08)}
 100%{transform:rotate(720deg) scale(0);opacity:0;max-width:0;padding-left:0;padding-right:0;margin-left:-16px}
}
#done p{font-size:20px;max-width:28ch;margin:0 auto}
.heart{position:fixed;top:-60px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){#no.bye{animation-duration:.01s}.heart{display:none}}
</style>
</head>
<body>
<main>
 <section id="ask">
  <div class="emoji">🥺</div>
  <h1>Seda, beni affeder misin?</h1>
  <p id="hint"></p>
  <div class="row">
   <button id="yes">Evet</button>
   <button id="no">Hayır</button>
  </div>
 </section>
 <section id="done" hidden>
  <div class="emoji">🥰</div>
  <h1>Biliyordum!</h1>
  <p>Beni affettiğin için teşekkür ederim. Seni çok seviyorum ❤️</p>
 </section>
</main>
<script>
var n = 0;
var yes = document.getElementById('yes');
var no = document.getElementById('no');
var hint = document.getElementById('hint');
var msgs = ["", "Emin misin? 🥺", "Bir daha düşün lütfen...", "Çok pişmanım, gerçekten 🥹", "Son şansın! 👀"];

function grow(k){
  yes.style.fontSize = (20 + k * 10) + 'px';
  yes.style.padding = (12 + k * 4) + 'px ' + (28 + k * 8) + 'px';
}

no.addEventListener('click', function(){
  n++;
  if (n < 5) {
    grow(n);
    hint.textContent = msgs[n];
  } else {
    hint.textContent = "O zaman böyle yapayım 😌";
    grow(7);
    no.classList.add('bye');
    no.addEventListener('animationend', function(){ no.remove(); }, { once: true });
  }
});

yes.addEventListener('click', function(){
  document.getElementById('ask').hidden = true;
  document.getElementById('done').hidden = false;
  var icons = ['💖', '💕', '❤️', '💗'];
  for (var i = 0; i < 60; i++) {
    var h = document.createElement('span');
    h.className = 'heart';
    h.textContent = icons[i % 4];
    h.style.left = (Math.random() * 100) + 'vw';
    h.style.fontSize = (18 + Math.random() * 26) + 'px';
    h.style.animationDuration = (3 + Math.random() * 3) + 's';
    h.style.animationDelay = (Math.random() * 2) + 's';
    document.body.appendChild(h);
  }
});
</script>
</body>
</html>
